<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1120">
    <title>404 - Página não encontrada</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b1120;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .code {
            font-size: clamp(100px, 25vw, 180px);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -10px;
            color: #3b82f6;
            text-shadow: 0 0 60px rgba(59, 130, 246, 0.25);
            margin-bottom: 25px;
        }

        .code span {
            color: #e2e8f0;
        }

        h1 {
            font-size: clamp(24px, 5vw, 36px);
            margin-bottom: 15px;
        }

        p {
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 14px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s ease;
        }

        .btn-primary {
            background: #3b82f6;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .btn-secondary {
            border: 1px solid #334155;
            color: #cbd5e1;
        }

        .btn-secondary:hover {
            background: #1e293b;
        }

        footer {
            margin-top: 60px;
            color: #64748b;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .code {
                letter-spacing: -5px;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="container">
        <div class="code">4<span>0</span>4</div>

        <h1>Página não encontrada</h1>

        <p>
            Ops! A página que você está procurando não existe,
            foi removida ou o endereço digitado está incorreto.
        </p>

        <div class="buttons">
            <a href="/" class="btn btn-primary">
                Voltar para o início
            </a>

            <a href="javascript:history.back()" class="btn btn-secondary">
                Voltar à página anterior
            </a>
        </div>

        <footer>
            ERRO 404 &bull; Página não encontrada
        </footer>
    </main>

</body>
</html>
